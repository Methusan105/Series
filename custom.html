<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Player template." />
  <link rel="icon" href="/Series/assets/favicon.svg" type="image/svg+xml" />
  <meta property="og:site_name" content="Series" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Player template — Series" />
  <meta property="og:description" content="Player template." />
  <meta property="og:image" content="https://methusan105.github.io/Series/images/bg.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Player template — Series</title>
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <script src="/Series/Playback.js"></script>
  <script src="https://cdn.sc.gl/videojs-hotkeys/latest/videojs.hotkeys.min.js"></script>
  <link rel="stylesheet" href="/Series/assets/css/player.css" />
</head>
<body>
  <div class="video-container">
    <div class="video-glow"></div>
    <video
      id="my-video"
      class="video-js vjs-fluid"
      controls
      preload="metadata"
      playsinline
    >
      <source src="https://example.com/default.mp4" type="video/mp4" />
      
      <p class="vjs-no-js">
        To view this video please enable JavaScript, and consider upgrading to a
        web browser that
        <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
      </p>
    </video>
    <div class="player-footer">
      <a href="/Series/My%20Hero%20Academia/S01/2.html" class="next-episode" onclick="clearGistProgress()">Next Episode &rarr;</a>
      <button class="clear-btn" type="button" onclick="clearGistProgress()">Clear Progress</button>
    </div>
    <p class="hint">Space: Play/Pause &bull; &larr; &rarr;: Seek 5s &bull; F: Fullscreen &bull; M: Mute &bull; C: Subs &bull; &uarr; &darr;: Volume</p>
  </div>
  <script>
var player = videojs("my-video", {
  preload: "metadata",
  playbackRates: [0.5, 1, 1.25, 1.5, 2],
  fluid: true,
  plugins: {
    hotkeys: {
      volumeStep: 0.1,
      seekStep: 5,
      enableModifiersForNumbers: false,
      alwaysCaptureHotkeys: true,
      seekModifiers: false
    }
  }
});
window.player = player;

document.addEventListener("keydown", function (event) {
  if (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA") return;
  if (event.key === " ") { event.preventDefault(); player.paused() ? player.play() : player.pause(); }
  else if (event.key === "f" || event.key === "F") { player.isFullscreen() ? player.exitFullscreen() : player.requestFullscreen(); }
  else if (event.key === "ArrowLeft") { player.currentTime(player.currentTime() - 5); }
  else if (event.key === "ArrowRight") { player.currentTime(player.currentTime() + 5); }
});

var saveInterval = 120000;
var lastSavedTime = -1;

// Dead source recovery state
var loadGraceMs = 10000;   // no metadata within this = suspect dead
var recoveryAttempts = 0;
var recoveryMax = 3;       // hard cap: a dead link must not loop forever
var recovering = false;
var pendingSeek = null;
var lastKnownProgress = 0;
var progressReady = false;
var pendingRecovery = null;

SeriesAuth.require(function () {
  loadProgress();
});

function saveProgress(force) {
  if (recovering) return;
  var creds = SeriesAuth.get();
  var now = player.currentTime();
  if (!force && Math.abs(now - lastSavedTime) < 2) return;
  lastSavedTime = now;
  persistPosition(now);
}

function persistPosition(pos) {
  var creds = SeriesAuth.get();
  SeriesAuth.writeProgress(creds, {
    "progress": pos,
    "url": window.location.href,
    "timeOnPage": (Date.now() - (window.__pageLoadTime || Date.now())) / 1000
  });
}

function seekTo(t) {
  if (typeof t !== 'number' || !isFinite(t) || t < 0) return;
  try { player.currentTime(t); } catch (e) { pendingSeek = t; }
}

function loadProgress() {
  SeriesAuth.fetchProgress(SeriesAuth.get(), function (pd) {
    if (pd && pd.progress) {
      lastKnownProgress = parseFloat(pd.progress);
      seekTo(lastKnownProgress);
    }
    markProgressReady();
  });
  // Never let a slow progress read block dead-source recovery forever.
  setTimeout(markProgressReady, 3000);
}

function markProgressReady() {
  if (progressReady) return;
  progressReady = true;
  if (pendingRecovery) {
    var reason = pendingRecovery;
    pendingRecovery = null;
    recoverFromDeadSource(reason);
  }
}

function recoverFromDeadSource(reason) {
  if (!progressReady) { pendingRecovery = reason; return; }
  if (recovering) return;
  recovering = true;
  var savedPos = player.currentTime() || lastKnownProgress || 0;
  persistPosition(savedPos);   // save BEFORE refreshing
  console.warn('Dead video source (' + reason + '); saved ' + Math.round(savedPos) + 's, refreshing.');
  refreshAndRestore(savedPos);
}

function refreshAndRestore(savedPos) {
  pendingSeek = null;
  player.load();
  SeriesAuth.fetchProgress(SeriesAuth.get(), function (pd) {
    var target = savedPos > 0 ? savedPos : ((pd && pd.progress) ? parseFloat(pd.progress) : 0);
    if (target) {
      pendingSeek = target;
      seekTo(target);
    }
    var p = player.play();
    if (p && p.catch) p.catch(function () {});
  });

  var waited = 0;
  var poll = setInterval(function () {
    if (player.readyState() >= 1) {
      clearInterval(poll);
      recovering = false;
      recoveryAttempts = 0;
    } else if (player.error()) {
      clearInterval(poll);
      retryOrGiveUp(savedPos);
    } else if ((waited += 400) >= 10000) {
      clearInterval(poll);
      retryOrGiveUp(savedPos);
    }
  }, 400);
}

function retryOrGiveUp(savedPos) {
  recoveryAttempts += 1;
  if (recoveryAttempts < recoveryMax) {
    setTimeout(function () { refreshAndRestore(savedPos); }, recoveryAttempts * 2000);
  } else {
    recovering = false;
    console.error('Video source is dead after ' + recoveryMax + ' attempts; progress saved at ' + Math.round(savedPos) + 's.');
  }
}

player.on("loadedmetadata", function () {
  if (pendingSeek != null) {
    seekTo(pendingSeek);
    pendingSeek = null;
  }
  recoveryAttempts = 0;
  recovering = false;
});

player.on("error", function () {
  var err = player.error();
  if (err && (err.code === 2 || err.code === 3 || err.code === 4)) {
    recoverFromDeadSource('media error ' + err.code);
  }
});

// With <source> children the error fires on the <source> element, not always
// on the video, so listen there too for near-instant detection.
var customSourceEls = player.el().querySelectorAll('source');
for (var csi = 0; csi < customSourceEls.length; csi++) {
  customSourceEls[csi].addEventListener('error', function () {
    setTimeout(function () {
      if (player.readyState() < 1) {
        recoverFromDeadSource('source unavailable');
      }
    }, 500);
  });
}

// Early detection: a dead source never produces metadata. Don't wait for the
// browser's slow error - check ourselves after a short grace.
setTimeout(function () {
  if (!player.error() && player.readyState() < 1) {
    recoverFromDeadSource('no media data after load');
  }
}, loadGraceMs);

player.on("pause", function () { saveProgress(true); });
player.on("ended", function () { saveProgress(true); });

window.__pageLoadTime = Date.now();

setInterval(function () { saveProgress(false); }, saveInterval);

window.addEventListener('beforeunload', function () {
  saveProgress(true);
});

  </script>
</body>
</html>
