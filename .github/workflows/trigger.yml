name: Start Alle Puljer Automatisk

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (f.eks. v1.0.0)'
        required: true
        type: string
      video_format:
        description: 'Velg videoformat/kodek'
        required: true
        default: 'HEVC (H.265)'
        type: choice
        options:
          - 'HEVC (H.265)'
          - 'AVC (H.264)'
          - 'VP9 (WebM)'
      audio_format:
        description: 'Velg lydformat/kodek'
        required: true
        default: 'Behold original lyd (Copy)'
        type: choice
        options:
          - 'Behold original lyd (Copy)'
          - 'AAC'
          - 'Opus'
          - 'AC3'
      output_container:
        description: 'Velg filformat (container)'
        required: true
        default: '.mp4'
        type: choice
        options:
          - '.mp4'
          - '.mkv'
          - '.webm'
          - '.mov'
      crf:
        description: 'Kvalitet/CRF'
        required: true
        default: '28'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch-batches:
    runs-on: ubuntu-latest
    steps:
      - name: Generer og send ut workflows for hver pulje
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          V_FMT: ${{ inputs.video_format }}
          A_FMT: ${{ inputs.audio_format }}
          CONTAINER: ${{ inputs.output_container }}
          CRF: ${{ inputs.crf }}
        run: |
          # 1. Finn totalt antall videofiler
          TOTAL_COUNT=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name | select(test("\\.(mp4|mkv|mov|avi|webm)$"; "i"))] | length')
          echo "Totalt antall filer: $TOTAL_COUNT"

          # 2. Bruker et Python-skript uten f-string komplikasjoner for API-kallene
          python3 - << 'EOF'
          import os, subprocess

          total = int(os.environ["TOTAL_COUNT"])
          repo = os.environ["REPO"]
          tag = os.environ["TAG"]
          v_fmt = os.environ["V_FMT"]
          a_fmt = os.environ["A_FMT"]
          container = os.environ["CONTAINER"]
          crf = os.environ["CRF"]

          chunk_size = 21
          start = 0

          while start < total:
              end = min(start + chunk_size, total)
              print(f"Trigget pulje: {start} til {end}")
              
              api_url = f"repos/{repo}/actions/workflows/convert-release.yml/dispatches"
              
              cmd = [
                  "gh", "api", api_url,
                  "-X", "POST",
                  "-f", "ref=main",
                  "-f", f"inputs[release_tag]={tag}",
                  "-f", f"inputs[start_index]={str(start)}",
                  "-f", f"inputs[end_index]={str(end)}",
                  "-f", f"inputs[video_format]={v_fmt}",
                  "-f", f"inputs[audio_format]={a_fmt}",
                  "-f", f"inputs[output_container]={container}",
                  "-f", f"inputs[crf]={crf}"
              ]
              
              subprocess.run(cmd, check=True)
              start = end
          EOF
