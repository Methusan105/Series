name: Start Alle Puljer Automatisk

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (f.eks. v1.0.0)'
        required: true
        type: string
      video_format:
        description: 'Velg videoformat/kodek'
        required: true
        default: 'HEVC (H.265)'
        type: choice
        options:
          - 'HEVC (H.265)'
          - 'AVC (H.264)'
          - 'VP9 (WebM)'
      audio_format:
        description: 'Velg lydformat/kodek'
        required: true
        default: 'Behold original lyd (Copy)'
        type: choice
        options:
          - 'Behold original lyd (Copy)'
          - 'AAC'
          - 'Opus'
          - 'AC3'
      output_container:
        description: 'Velg filformat (container)'
        required: true
        default: '.mp4'
        type: choice
        options:
          - '.mp4'
          - '.mkv'
          - '.webm'
          - '.mov'
      crf:
        description: 'Kvalitet/CRF'
        required: true
        default: '28'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch-batches:
    runs-on: ubuntu-latest
    steps:
      - name: Generer og send ut workflows for hver pulje
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          V_FMT: ${{ inputs.video_format }}
          A_FMT: ${{ inputs.audio_format }}
          CONTAINER: ${{ inputs.output_container }}
          CRF: ${{ inputs.crf }}
        run: |
           # 1. Finn totalt antall videofiler
           assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name | select(test("\\.(mp4|mkv|mov|avi|webm)$"; "i"))]')
           TOTAL_COUNT=$(echo "$assets" | jq 'length')
           echo "Totalt antall filer: $TOTAL_COUNT"

           # 2. Trigger transcribe-vtt.yml for hver asset
           echo "$assets" | jq -r '.[]' | while read -r asset; do
               echo "Trigger transcribe for: $asset"
               gh api "repos/$REPO/actions/workflows/transcribe-vtt.yml/dispatches" \
                 -X POST \
                 -f "ref=testings" \
                 -f "inputs[release_tag]=$TAG" \
                 -f "inputs[asset_name]=$asset" \
                 -f "inputs[model]=distil-large-v3"
           done
