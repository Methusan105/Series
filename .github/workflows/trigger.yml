name: Trigger Transcribe VTT (all assets)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch-batches:
    runs-on: ubuntu-latest
    steps:
      - name: Generer og send ut workflows for hver pulje
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
           # 1. Finn totalt antall videofiler
           assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name | select(test("\\.(mp4|mkv|mov|avi|webm)$"; "i"))]')
           TOTAL_COUNT=$(echo "$assets" | jq 'length')
           echo "Totalt antall filer: $TOTAL_COUNT"

           # 2. Trigger transcribe-vtt.yml for hver asset
           echo "$assets" | jq -r '.[]' | while read -r asset; do
               echo "Trigger transcribe for: $asset"
               gh api "repos/$REPO/actions/workflows/transcribe-vtt.yml/dispatches" \
                 -X POST \
                 -f "ref=main" \
                 -f "inputs[release_tag]=$TAG" \
                 -f "inputs[asset_name]=$asset" \
                 -f "inputs[model]=large-v3"
           done
