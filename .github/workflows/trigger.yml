name: Start Alle Puljer Automatisk

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (f.eks. v1.0.0)'
        required: true
        type: string
      video_format:
        description: 'Velg videoformat/kodek'
        required: true
        default: 'HEVC (H.265)'
        type: choice
        options:
          - 'HEVC (H.265)'
          - 'AVC (H.264)'
          - 'VP9 (WebM)'
      audio_format:
        description: 'Velg lydformat/kodek'
        required: true
        default: 'Behold original lyd (Copy)'
        type: choice
        options:
          - 'Behold original lyd (Copy)'
          - 'AAC'
          - 'Opus'
          - 'AC3'
      output_container:
        description: 'Velg filformat (container)'
        required: true
        default: '.mp4'
        type: choice
        options:
          - '.mp4'
          - '.mkv'
          - '.webm'
          - '.mov'
      crf:
        description: 'Kvalitet/CRF'
        required: true
        default: '28'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch-batches:
    runs-on: ubuntu-latest
    steps:
      - name: Generer og send ut workflows for hver pulje
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          V_FMT: ${{ inputs.video_format }}
          A_FMT: ${{ inputs.audio_format }}
          CONTAINER: ${{ inputs.output_container }}
          CRF: ${{ inputs.crf }}
        run: |
          # 1. Finn totalt antall videofiler
          TOTAL_COUNT=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name | select(test("\\.(mp4|mkv|mov|avi|webm)$"; "i"))] | length')
          echo "Totalt antall filer: $TOTAL_COUNT"

          # 2. Start loopen i ren Bash for å unngå miljøvariabel-krøll
          chunk_size=21
          start=0

          while [ "$start" -lt "$TOTAL_COUNT" ]; do
              end=$((start + chunk_size))
              if [ "$end" -gt "$TOTAL_COUNT" ]; then
                  end="$TOTAL_COUNT"
              fi

              echo "Trigget pulje: $start til $end"

              gh api "repos/$REPO/actions/workflows/convert-release.yml/dispatches" \
                -X POST \
                -f "ref=main" \
                -f "inputs[release_tag]=$TAG" \
                -f "inputs[start_index]=$start" \
                -f "inputs[end_index]=$end" \
                -f "inputs[video_format]=$V_FMT" \
                -f "inputs[audio_format]=$A_FMT" \
                -f "inputs[output_container]=$CONTAINER" \
                -f "inputs[crf]=$CRF"

              start=$end
          done
