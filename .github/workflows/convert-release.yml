name: Konverter Release Medier (Matrise / En fil per jobb)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (f.eks. v1.0.0)'
        required: true
        type: string
      video_format:
        description: 'Velg videoformat/kodek'
        required: true
        default: 'HEVC (H.265)'
        type: choice
        options:
          - 'HEVC (H.265)'
          - 'AVC (H.264)'
          - 'VP9 (WebM)'
      audio_format:
        description: 'Velg lydformat/kodek'
        required: true
        default: 'Behold original lyd (Copy)'
        type: choice
        options:
          - 'Behold original lyd (Copy)'
          - 'AAC'
          - 'Opus'
          - 'AC3'
      output_container:
        description: 'Velg filformat (container)'
        required: true
        default: '.mp4'
        type: choice
        options:
          - '.mp4'
          - '.mkv'
          - '.webm'
          - '.mov'
      crf:
        description: 'Kvalitet/CRF (Lavere tall = bedre kvalitet, f.eks. 28 for HEVC)'
        required: true
        default: '28'
        type: string

permissions:
  contents: write

jobs:
  get-assets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Hent liste over assets
        id: set-matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          ASSETS_JSON=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name | select(test("\\.(mp4|mkv|mov|avi|webm)$"; "i"))]')
          echo "Fant følgende videofiler: $ASSETS_JSON"
          echo "matrix=$ASSETS_JSON" >> $GITHUB_OUTPUT

  convert-asset:
    needs: get-assets
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4  # Kjører 4 filer i parallell for å bli ferdig raskere
      matrix:
        asset_name: ${{ fromJson(needs.get-assets.outputs.matrix) }}
    steps:
      - name: Sjekk ut kodelager
        uses: actions/checkout@v4

      - name: Frigjør diskplass på runneren
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Opprett mapper
        run: mkdir -p input_files output_files

      - name: Last ned denne filen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          echo "Laster ned: ${{ matrix.asset_name }}"
          gh release download "$TAG" --pattern "${{ matrix.asset_name }}" --dir input_files --repo "$REPO"

      - name: Konverter filen
        run: |
          case "${{ inputs.video_format }}" in
            "HEVC (H.265)") VCODEC="libx265" ;;
            "AVC (H.264)")  VCODEC="libx264" ;;
            "VP9 (WebM)")   VCODEC="libvpx-vp9" ;;
          esac

          case "${{ inputs.audio_format }}" in
            "Behold original lyd (Copy)") ACODEC="copy" ;;
            "AAC")                         ACODEC="aac" ;;
            "Opus")                        ACODEC="libopus" ;;
            "AC3")                         ACODEC="ac3" ;;
          esac

          ASSET="${{ matrix.asset_name }}"
          BASENAME="${ASSET%.*}"
          EXT="${{ inputs.output_container }}"
          
          FILE="input_files/$ASSET"
          OUT_FILE="output_files/${BASENAME}${EXT}"

          echo "Konverterer $FILE til $OUT_FILE..."
          ffmpeg -i "$FILE" -c:v "$VCODEC" -crf ${{ inputs.crf }} -c:a "$ACODEC" "$OUT_FILE"
          
          # Verifikasjon: Sjekk at ut-filen eksisterer og har innhold
          test -s "$OUT_FILE" && echo "Konvertering vellykket!"

      - name: Last opp konvertert fil tilbake til releasen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          ASSET="${{ matrix.asset_name }}"
          BASENAME="${ASSET%.*}"
          EXT="${{ inputs.output_container }}"
          OUT_FILE="output_files/${BASENAME}${EXT}"

          echo "Laster opp $OUT_FILE til release $TAG..."
          gh release upload "$TAG" "$OUT_FILE" --clobber --repo "$REPO"
