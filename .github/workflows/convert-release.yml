name: Konverter Enkel Pulje

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: true
        type: string
      start_index:
        description: 'Start indeks'
        required: true
        type: string
      end_index:
        description: 'Slutt indeks'
        required: true
        type: string
      video_format:
        description: 'Videoformat'
        required: true
        default: 'HEVC (H.265)'
        type: string
      audio_format:
        description: 'Lydformat'
        required: true
        default: 'Behold original lyd (Copy)'
        type: string
      output_container:
        description: 'Container'
        required: true
        default: '.mp4'
        type: string
      crf:
        description: 'CRF'
        required: true
        default: '28'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  convert-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut kodelager
        uses: actions/checkout@v4

      - name: Frigjør diskplass
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Opprett mapper
        run: mkdir -p input_files output_files

      - name: Hent og konverter pulje (Fra ${{ inputs.start_index }} til ${{ inputs.end_index }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          START: ${{ inputs.start_index }}
          END: ${{ inputs.end_index }}
        run: |
          FILES_TO_DOWNLOAD=$(gh release view "$TAG" --repo "$REPO" --json assets --jq "[.assets[].name | select(test(\"\\\\.(mp4|mkv|mov|avi|webm)$\"; \"i\"))] | sort | .[$START:$END][]")
          
          for filename in $FILES_TO_DOWNLOAD; do
            echo "Laster ned: $filename"
            gh release download "$TAG" --pattern "$filename" --dir input_files --repo "$REPO"
          done

          case "${{ inputs.video_format }}" in
            "HEVC (H.265)") VCODEC="libx265" ;;
            "AVC (H.264)")  VCODEC="libx264" ;;
            "VP9 (WebM)")   VCODEC="libvpx-vp9" ;;
          esac

          case "${{ inputs.audio_format }}" in
            "Behold original lyd (Copy)") ACODEC="copy" ;;
            "AAC")                         ACODEC="aac" ;;
            "Opus")                        ACODEC="libopus" ;;
            "AC3")                         ACODEC="ac3" ;;
          esac

          EXT="${{ inputs.output_container }}"

          for file in input_files/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              basename_no_ext="${filename%.*}"
              OUT_FILE="output_files/${basename_no_ext}${EXT}"
              
              echo "Konverterer $filename til $OUT_FILE..."
              ffmpeg -i "$file" -c:v "$VCODEC" -crf ${{ inputs.crf }} -c:a "$ACODEC" "$OUT_FILE"
              rm -f "$file"
            fi
          done

      - name: Last opp til release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" output_files/* --clobber --repo "$REPO"
