name: Konverter Enkel Pulje (Eksakt Kommando)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: true
        type: string
      start_index:
        description: 'Start indeks'
        required: true
        type: string
      end_index:
        description: 'Slutt indeks'
        required: true
        type: string
      audio_format:
        description: 'Lydformat'
        required: true
        default: 'AAC'
        type: choice
        options:
          - 'Behold original lyd (Copy)'
          - 'AAC'
          - 'Opus'
          - 'AC3'
      output_container:
        description: 'Container'
        required: true
        default: '.mp4'
        type: choice
        options:
          - '.mp4'
          - '.mkv'
          - '.webm'
          - '.mov'

permissions:
  contents: write

jobs:
  get-assets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Hent ut riktig fil-intervall for denne puljen
        id: set-matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          START: ${{ inputs.start_index }}
          END: ${{ inputs.end_index }}
        run: |
          ASSETS_JSON=$(gh release view "$TAG" --repo "$REPO" --json assets --jq "[.assets[].name | select(test(\"\\\\.(mp4|mkv|mov|avi|webm)$\"; \"i\"))] | sort | .[$START:$END]" | jq -c '.')
          echo "Valgte filer for denne puljen: $ASSETS_JSON"
          echo "matrix=$ASSETS_JSON" >> $GITHUB_OUTPUT

  convert-asset:
    needs: get-assets
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        asset_name: ${{ fromJson(needs.get-assets.outputs.matrix) }}
    steps:
      - name: Sjekk ut kodelager
        uses: actions/checkout@v4

      - name: Frigjør diskplass på runneren
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Opprett mapper
        run: mkdir -p input_files output_files

      - name: Last ned denne filen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          echo "Laster ned: ${{ matrix.asset_name }}"
          gh release download "$TAG" --pattern "${{ matrix.asset_name }}" --dir input_files --repo "$REPO"

      - name: Kjør FFmpeg med nøyaktig ønsket kommando
        run: |
          case "${{ inputs.audio_format }}" in
            "Behold original lyd (Copy)") ACODEC="copy" ;;
            "AAC")                         ACODEC="aac" ;;
            "Opus")                        ACODEC="libopus" ;;
            "AC3")                         ACODEC="ac3" ;;
          esac

          ASSET="${{ matrix.asset_name }}"
          BASENAME="${ASSET%.*}"
          EXT="${{ inputs.output_container }}"
          
          FILE="input_files/$ASSET"
          OUT_FILE="output_files/${BASENAME}${EXT}"

          echo "Kjører FFmpeg for: $ASSET"

          if [ "$ACODEC" = "copy" ]; then
              # Hvis lyd også skal kopieres
              ffmpeg -i "$FILE" -c:v copy -c:a copy -map 0:v -map 0:a:0 -y "$OUT_FILE"
          else
              # Bruker din eksakte kommando med spesifisert lydkodek og 320k bitrate
              ffmpeg -i "$FILE" -c:v copy -c:a "$ACODEC" -b:a 320k -map 0:v -map 0:a:0 -y "$OUT_FILE"
          fi

          test -s "$OUT_FILE" && echo "Konvertering vellykket!"

      - name: Last opp konvertert fil tilbake til releasen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          ASSET="${{ matrix.asset_name }}"
          BASENAME="${ASSET%.*}"
          EXT="${{ inputs.output_container }}"
          OUT_FILE="output_files/${BASENAME}${EXT}"

          echo "Laster opp $OUT_FILE til release $TAG..."
          gh release upload "$TAG" "$OUT_FILE" --clobber --repo "$REPO"
