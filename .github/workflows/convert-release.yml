name: Konverter Enkel Pulje (Maks 2GB med Map & Smart Bitrate)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: true
        type: string
      start_index:
        description: 'Start indeks'
        required: true
        type: string
      end_index:
        description: 'Slutt indeks'
        required: true
        type: string
      video_format:
        description: 'Videoformat'
        required: true
        default: 'HEVC (H.265)'
        type: choice
        options:
          - 'HEVC (H.265)'
          - 'AVC (H.264)'
          - 'VP9 (WebM)'
          - 'Behold original video (Copy)'
      audio_format:
        description: 'Lydformat'
        required: true
        default: 'Behold original lyd (Copy)'
        type: choice
        options:
          - 'Behold original lyd (Copy)'
          - 'AAC'
          - 'Opus'
          - 'AC3'
      output_container:
        description: 'Container'
        required: true
        default: '.mp4'
        type: choice
        options:
          - '.mp4'
          - '.mkv'
          - '.webm'
          - '.mov'
      ffmpeg_maps:
        description: 'Ekstra FFmpeg map-argumenter (f.eks. -map 0:v:0 -map 0:a:0 eller bare la stå tom for alt)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  get-assets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Hent ut riktig fil-intervall for denne puljen
        id: set-matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          START: ${{ inputs.start_index }}
          END: ${{ inputs.end_index }}
        run: |
          ASSETS_JSON=$(gh release view "$TAG" --repo "$REPO" --json assets --jq "[.assets[].name | select(test(\"\\\\.(mp4|mkv|mov|avi|webm)$\"; \"i\"))] | sort | .[$START:$END]" | jq -c '.')
          echo "Valgte filer for denne puljen: $ASSETS_JSON"
          echo "matrix=$ASSETS_JSON" >> $GITHUB_OUTPUT

  convert-asset:
    needs: get-assets
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        asset_name: ${{ fromJson(needs.get-assets.outputs.matrix) }}
    steps:
      - name: Sjekk ut kodelager
        uses: actions/checkout@v4

      - name: Frigjør diskplass på runneren
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Opprett mapper
        run: mkdir -p input_files output_files

      - name: Last ned denne filen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          echo "Laster ned: ${{ matrix.asset_name }}"
          gh release download "$TAG" --pattern "${{ matrix.asset_name }}" --dir input_files --repo "$REPO"

      - name: Konverter med smart 2GB-grense og tilpasset Map
        run: |
          case "${{ inputs.video_format }}" in
            "HEVC (H.265)") VCODEC="libx265" ;;
            "AVC (H.264)")  VCODEC="libx264" ;;
            "VP9 (WebM)")   VCODEC="libvpx-vp9" ;;
            "Behold original video (Copy)") VCODEC="copy" ;;
          esac

          case "${{ inputs.audio_format }}" in
            "Behold original lyd (Copy)") ACODEC="copy" ;;
            "AAC")                         ACODEC="aac" ;;
            "Opus")                        ACODEC="libopus" ;;
            "AC3")                         ACODEC="ac3" ;;
          esac

          ASSET="${{ matrix.asset_name }}"
          BASENAME="${ASSET%.*}"
          EXT="${{ inputs.output_container }}"
          
          FILE="input_files/$ASSET"
          OUT_FILE="output_files/${BASENAME}${EXT}"

          # Hent brukerens egne map-argumenter hvis de er oppgitt
          MAP_ARGS="${{ inputs.ffmpeg_maps }}"

          echo "Analyserer metadata for $FILE med ffprobe..."
          
          # Henter både varighet og kildens totale bitrate via Python/ffprobe
          PROBE_DATA=$(python3 -c "
          import subprocess, json
          result = subprocess.run(['ffprobe', '-v', 'quiet', '-print_format', 'json', '-show_format', '$FILE'], capture_output=True, text=True)
          data = json.loads(result.stdout)
          format_info = data.get('format', {})
          duration = float(format_info.get('duration', 0))
          bit_rate = int(format_info.get('bit_rate', 0)) if 'bit_rate' in format_info else 0
          print(f'{duration},{bit_rate}')
          ")

          DURATION=$(echo "$PROBE_DATA" | cut -d',' -f1)
          SOURCE_BITRATE=$(echo "$PROBE_DATA" | cut -d',' -f2)

          echo "Filens varighet: $DURATION sekunder"
          echo "Kildens opprinnelige bitrate: $SOURCE_BITRATE bps"

          # Beregn maks bitrate for å treffe 1.9 GB
          TARGET_BITS=$(python3 -c "print(int((1.9 * 1024 * 1024 * 1024 * 8) / $DURATION))")

          # Smart logikk: Aldri bruk høyere bitrate enn kilden (med mindre kilden er ukjent/null, eller du eksplisitt vil presse den)
          # Hvis kildens bitrate er lavere enn 2GB-grensen, beholder vi kildens bitrate (eller lar den kopieres)
          if [ "$SOURCE_BITRATE" -gt 0 ] && [ "$SOURCE_BITRATE" -lt "$TARGET_BITS" ]; then
              echo "Kildens bitrate er lavere enn 2GB-grensen. Bruker kildens bitrate for å unngå å sløse plass."
              FINAL_VIDEO_BITRATE="$SOURCE_BITRATE"
          else
              FINAL_VIDEO_BITRATE="$TARGET_BITS"
          fi

          echo "Valgt videobitrate for konvertering: $FINAL_VIDEO_BITRATE bps"

          # Bygg opp kommandoen basert på om vi kopierer eller omkoder
          if [ "$VCODEC" = "copy" ] && [ "$ACODEC" = "copy" ]; then
              echo "Kopierer både video og lyd direkte..."
              if [ -n "$MAP_ARGS" ]; then
                  ffmpeg -y -i "$FILE" $MAP_ARGS -c copy "$OUT_FILE"
              else
                  ffmpeg -y -i "$FILE" -c copy "$OUT_FILE"
              fi
          elif [ "$VCODEC" = "copy" ]; then
              echo "Kopierer video direkte, omkoder lyd..."
              if [ -n "$MAP_ARGS" ]; then
                  ffmpeg -y -i "$FILE" $MAP_ARGS -c:v copy -c:a "$ACODEC" -b:a 192k "$OUT_FILE"
              else
                  ffmpeg -y -i "$FILE" -i "$FILE" -c:v copy -c:a "$ACODEC" -b:a 192k "$OUT_FILE"
              fi
          else
              # 2-pass omkodning av video
              echo "Starter Pass 1..."
              if [ -n "$MAP_ARGS" ]; then
                  ffmpeg -y -i "$FILE" $MAP_ARGS -c:v "$VCODEC" -b:v "$FINAL_VIDEO_BITRATE" -pass 1 -an -f null /dev/null
              else
                  ffmpeg -y -i "$FILE" -c:v "$VCODEC" -b:v "$FINAL_VIDEO_BITRATE" -pass 1 -an -f null /dev/null
              fi

              echo "Starter Pass 2..."
              if [ "$ACODEC" = "copy" ]; then
                  if [ -n "$MAP_ARGS" ]; then
                      ffmpeg -y -i "$FILE" $MAP_ARGS -c:v "$VCODEC" -b:v "$FINAL_VIDEO_BITRATE" -pass 2 -c:a copy "$OUT_FILE"
                  else
                      ffmpeg -y -i "$FILE" -c:v "$VCODEC" -b:v "$FINAL_VIDEO_BITRATE" -pass 2 -c:a copy "$OUT_FILE"
                  fi
              else
                  if [ -n "$MAP_ARGS" ]; then
                      ffmpeg -y -i "$FILE" $MAP_ARGS -c:v "$VCODEC" -b:v "$FINAL_VIDEO_BITRATE" -pass 2 -c:a "$ACODEC" -b:a 192k "$OUT_FILE"
                  else
                      ffmpeg -y -i "$FILE" -c:v "$VCODEC" -b:v "$FINAL_VIDEO_BITRATE" -pass 2 -c:a "$ACODEC" -b:a 192k "$OUT_FILE"
                  fi
              fi

              rm -f ffmpeg2pass-0.log ffmpeg2pass-0.log.mbtree
          fi

          test -s "$OUT_FILE" && echo "Konvertering vellykket!"

      - name: Last opp konvertert fil tilbake til releasen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          ASSET="${{ matrix.asset_name }}"
          BASENAME="${ASSET%.*}"
          EXT="${{ inputs.output_container }}"
          OUT_FILE="output_files/${BASENAME}${EXT}"

          echo "Laster opp $OUT_FILE til release $TAG..."
          gh release upload "$TAG" "$OUT_FILE" --clobber --repo "$REPO"
