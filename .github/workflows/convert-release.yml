name: Konverter Enkel Pulje (Maks 2GB)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: true
        type: string
      start_index:
        description: 'Start indeks'
        required: true
        type: string
      end_index:
        description: 'Slutt indeks'
        required: true
        type: string
      video_format:
        description: 'Videoformat'
        required: true
        default: 'HEVC (H.265)'
        type: string
      audio_format:
        description: 'Lydformat'
        required: true
        default: 'Behold original lyd (Copy)'
        type: string
      output_container:
        description: 'Container'
        required: true
        default: '.mp4'
        type: choice
        options:
          - '.mp4'
          - '.mkv'
          - '.webm'
          - '.mov'

permissions:
  contents: write

jobs:
  get-assets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Hent ut riktig fil-intervall for denne puljen
        id: set-matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
          START: ${{ inputs.start_index }}
          END: ${{ inputs.end_index }}
        run: |
          ASSETS_JSON=$(gh release view "$TAG" --repo "$REPO" --json assets --jq "[.assets[].name | select(test(\"\\\\.(mp4|mkv|mov|avi|webm)$\"; \"i\"))] | sort | .[$START:$END]" | jq -c '.')
          echo "Valgte filer for denne puljen: $ASSETS_JSON"
          echo "matrix=$ASSETS_JSON" >> $GITHUB_OUTPUT

  convert-asset:
    needs: get-assets
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        asset_name: ${{ fromJson(needs.get-assets.outputs.matrix) }}
    steps:
      - name: Sjekk ut kodelager
        uses: actions/checkout@v4

      - name: Frigjør diskplass på runneren
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Installer FFmpeg og Python-avhengigheter
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-ffprobe

      - name: Opprett mapper
        run: mkdir -p input_files output_files

      - name: Last ned denne filen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          echo "Laster ned: ${{ matrix.asset_name }}"
          gh release download "$TAG" --pattern "${{ matrix.asset_name }}" --dir input_files --repo "$REPO"

      - name: Konverter til maksimal kvalitet under 2GB (2-pass)
        run: |
          case "${{ inputs.video_format }}" in
            "HEVC (H.265)") VCODEC="libx265" ;;
            "AVC (H.264)")  VCODEC="libx264" ;;
            "VP9 (WebM)")   VCODEC="libvpx-vp9" ;;
          esac

          case "${{ inputs.audio_format }}" in
            "Behold original lyd (Copy)") ACODEC="copy" ;;
            "AAC")                         ACODEC="aac" ;;
            "Opus")                        ACODEC="libopus" ;;
            "AC3")                         ACODEC="ac3" ;;
          esac

          ASSET="${{ matrix.asset_name }}"
          BASENAME="${ASSET%.*}"
          EXT="${{ inputs.output_container }}"
          
          FILE="input_files/$ASSET"
          OUT_FILE="output_files/${BASENAME}${EXT}"

          echo "Analyserer varighet for $FILE..."

          # Bruker Python til å hente nøyaktig varighet i sekunder ved hjelp av ffprobe
          DURATION=$(python3 -c "
          import subprocess, json
          result = subprocess.run(['ffprobe', '-v', 'quiet', '-print_format', 'json', '-show_format', '$FILE'], capture_output=True, text=True)
          data = json.loads(result.stdout)
          print(float(data['format']['duration']))
          ")

          echo "Filens varighet: $DURATION sekunder"

          # Vi sikter på 1.9 GB for å ha litt margin til overhead (ca. 16.300 megabit totalt)
          # Formel for bitrate (bits per sekund) = (Mål-størrelse i bytes * 8) / varighet
          # 1.9 GB = 1.9 * 1024 * 1024 * 1024 bytes = 2,039,634,329 bytes
          TARGET_BITS=$(python3 -c "print(int((1.9 * 1024 * 1024 * 1024 * 8) / $DURATION))")
          
          # Om det er lyd som kopieres, trekker vi fra litt plass til lyden hvis den skal omkodes, 
          # men hvis lyden kopieres (copy), kan nesten alt gå til videoen.
          # Vi setter en fornuftig grense på videobitrate:
          VIDEO_BITRATE=$TARGET_BITS
          
          echo "Beregnet optimal videobitrate for å treffe < 2GB: $VIDEO_BITRATE bps"

          echo "Starter Pass 1..."
          ffmpeg -y -i "$FILE" -c:v "$VCODEC" -b:v "$VIDEO_BITRATE" -pass 1 -an -f null /dev/null

          echo "Starter Pass 2 (fullfører konvertering)..."
          if [ "$ACODEC" = "copy" ]; then
            ffmpeg -y -i "$FILE" -c:v "$VCODEC" -b:v "$VIDEO_BITRATE" -pass 2 -c:a copy "$OUT_FILE"
          else
            ffmpeg -y -i "$FILE" -c:v "$VCODEC" -b:v "$VIDEO_BITRATE" -pass 2 -c:a "$ACODEC" -b:a 192k "$OUT_FILE"
          fi

          # Rydder opp etter pass-loggfiler
          rm -f ffmpeg2pass-0.log ffmpeg2pass-0.log.mbtree

          test -s "$OUT_FILE" && echo "Konvertering vellykket! Sjekk filstørrelse under 2GB."

      - name: Last opp konvertert fil tilbake til releasen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          ASSET="${{ matrix.asset_name }}"
          BASENAME="${ASSET%.*}"
          EXT="${{ inputs.output_container }}"
          OUT_FILE="output_files/${BASENAME}${EXT}"

          echo "Laster opp $OUT_FILE til release $TAG..."
          gh release upload "$TAG" "$OUT_FILE" --clobber --repo "$REPO"
