name: Dispatch Release Transcriptions

# Kept for muscle memory: dispatches the syncer per asset. The syncer can also
# take a whole release in one run (see trigger.yml), which is the cheaper path.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: v1.0.0)"
        required: true
        type: string
      model:
        description: "Whisper model to use for all dispatches"
        required: true
        default: distil-large-v3
        type: choice
        options:
          - tiny.en
          - base.en
          - small.en
          - medium.en
          - distil-large-v3
          - large-v3
      mode:
        description: "align = fix existing timing, replace = rewrite text, missing = only new subs"
        required: true
        default: align
        type: choice
        options:
          - align
          - replace
          - missing

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Get video assets from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name | select(test("\\.(mp4|mkv|mov|avi|webm)$"; "i"))' | sort > assets.txt
          cat assets.txt
          if [ ! -s assets.txt ]; then
            echo "::error::no video assets in release $TAG"
            exit 1
          fi

      - name: Start the syncer for each asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          TAG: ${{ inputs.release_tag }}
          MODEL: ${{ inputs.model }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          while read -r asset; do
            [ -n "$asset" ] || continue
            echo "Dispatching: $asset"
            payload=$(jq -n --arg ref "$REF" --arg tag "$TAG" --arg asset "$asset" \
              --arg model "$MODEL" --arg mode "$MODE" \
              '{ref: $ref, inputs: {release_tag: $tag, asset_name: $asset, model: $model, mode: $mode}}')
            echo "$payload" | gh api \
              "repos/$REPO/actions/workflows/transcribe-vtt.yml/dispatches" \
              --method POST --input -
          done < assets.txt
