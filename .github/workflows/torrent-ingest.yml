name: Torrent into a release (MP4)

# Hand this a magnet link or a .torrent URL and it does the whole job: pull the
# files down, convert every video to an AAC MP4 carrying only the track you ask
# for, upload each one to the release, and delete the download as it goes so a
# season pack fits on the runner's disk.
#
# Asset names follow the site: either the download's own name, or
# <show_name>.SxxExx.mp4 when you give a show name and the file carries an
# SxxExx marker. A file that is already an AAC MP4 is stream-copied instead of
# re-encoded, so handing it a finished set costs one remux per file.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release to fill (e.g. SN4); created when it does not exist"
        required: true
        type: string
      torrent:
        description: "Magnet link, or http(s) URL of a .torrent file"
        required: true
        type: string
      show_name:
        description: "Canonical show name for asset names (e.g. Supernatural); empty keeps the download's own name"
        required: false
        default: ""
        type: string
      filter:
        description: "Only convert files whose name matches this regex (optional, e.g. S04E0[1-3])"
        required: false
        default: ""
        type: string
      keep_audio:
        description: "Audio tracks to keep: all, or indexes/languages (e.g. eng), or title:<text>"
        required: true
        default: "eng"
        type: string
      drop_audio:
        description: "Audio tracks to drop after that: indexes/languages (optional)"
        required: false
        default: ""
        type: string
      skip_existing:
        description: "Leave alone any episode whose MP4 the release already holds"
        required: true
        default: true
        type: boolean
      list_only:
        description: "Only resolve the torrent and print its file list, download and convert nothing"
        required: true
        default: false
        type: boolean
      stall_minutes:
        description: "Give up when no peer has sent data for this long"
        required: true
        default: "20"
        type: string

permissions:
  contents: write

concurrency:
  group: torrent-ingest-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  ingest:
    name: ${{ inputs.release_tag }} from torrent
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.release_tag }}
      TORRENT: ${{ inputs.torrent }}
      SHOW: ${{ inputs.show_name }}
      FILTER: ${{ inputs.filter }}
      KEEP: ${{ inputs.keep_audio }}
      DROP: ${{ inputs.drop_audio }}
      SKIP_EXISTING: ${{ inputs.skip_existing }}
      PROBE: ${{ inputs.list_only }}
      STALL: ${{ inputs.stall_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          df -h /

      - name: Install aria2 and ffmpeg
        run: |
          set -euo pipefail
          need=()
          command -v aria2c >/dev/null 2>&1 || need+=(aria2)
          command -v ffmpeg >/dev/null 2>&1 || need+=(ffmpeg)
          if [ "${#need[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "${need[@]}"
          fi
          aria2c --version | head -n 1
          ffmpeg -version | head -n 1

      - name: Read the torrent's file list
        id: files
        run: |
          set -euo pipefail
          mkdir -p meta
          if [ "${TORRENT#magnet:}" != "$TORRENT" ]; then
            # A magnet carries no file list, so the metadata has to come from a
            # peer first. This is the step that fails when nothing can reach one.
            aria2c --dir=meta --bt-metadata-only=true --bt-save-metadata=true \
              --enable-dht=true --bt-stop-timeout=$((STALL * 60)) \
              --summary-interval=0 --console-log-level=warn "$TORRENT" || true
            torrent=$(find meta -maxdepth 1 -name '*.torrent' -print -quit)
          else
            curl -fsSL -o meta/source.torrent "$TORRENT"
            torrent=meta/source.torrent
          fi
          if [ -z "${torrent:-}" ] || [ ! -s "$torrent" ]; then
            echo "::error::no torrent metadata: no peer answered within ${STALL} minutes"
            exit 1
          fi
          cp "$torrent" torrent.torrent
          aria2c --show-files torrent.torrent > files.txt
          count=$(grep -cE '^ +[0-9]+\|' files.txt || true)
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::the torrent lists no files"
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "### Torrent for \`$TAG\`"
            echo ""
            echo "$count file(s)."
            echo ""
            echo '```'
            grep -E '^(Name:|Total Length:)' files.txt || true
            sed -n '/^Files:/,$p' files.txt | head -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PROBE" = true ]; then
            echo "List only: nothing downloaded, nothing converted."
            echo "PROBE_ONLY=1" >> "$GITHUB_ENV"
          fi

      - name: Make the release when it does not exist
        if: env.PROBE_ONLY != '1'
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --target main

      - name: Download the torrent
        if: env.PROBE_ONLY != '1'
        run: |
          set -euo pipefail
          mkdir -p dl
          aria2c --dir=dl --follow-torrent=true --seed-time=0 \
            --enable-dht=true --enable-peer-exchange=true --bt-max-peers=120 \
            --bt-stop-timeout=$((STALL * 60)) --file-allocation=none \
            --max-connection-per-server=16 --continue=true \
            --summary-interval=60 --console-log-level=warn torrent.torrent
          du -sh dl

      - name: Convert each video and upload it
        if: env.PROBE_ONLY != '1'
        run: |
          set -euo pipefail
          mkdir -p build

          # One deliverable per asset name. A pack can hold the same episode twice
          # (an MKV and an MP4, a 1080p and a 720p), and a sample can carry the
          # episode's own SxxExx, so the biggest file under a name wins and the
          # rest are dropped rather than racing for the same upload.
          declare -A pick=() pick_size=()
          while IFS= read -r f; do
            base=$(basename "$f")
            case ${base,,} in
              *sample*) echo "skip $base: sample"; continue ;;
            esac
            if [ -n "$FILTER" ] && ! printf '%s' "$f" | grep -Eqi "$FILTER"; then
              echo "skip $base: filter did not match"
              continue
            fi
            stem=${base%.*}
            if [ -n "$SHOW" ] && [[ $stem =~ [Ss]([0-9]{1,2})[Ee]([0-9]{1,2}) ]]; then
              season=$(printf '%02d' "$((10#${BASH_REMATCH[1]}))")
              episode=$(printf '%02d' "$((10#${BASH_REMATCH[2]}))")
              out="${SHOW}.S${season}E${episode}.mp4"
            else
              out="$stem.mp4"
            fi
            size=$(stat -c%s "$f")
            if [ -n "${pick[$out]:-}" ]; then
              if [ "$size" -gt "${pick_size[$out]}" ]; then
                echo "skip $(basename "${pick[$out]}"): smaller than $base for $out"
              else
                echo "skip $base: smaller than $(basename "${pick[$out]}") for $out"
                continue
              fi
            fi
            pick[$out]=$f
            pick_size[$out]=$size
          done < <(find dl -type f \( -iname '*.mkv' -o -iname '*.mp4' -o -iname '*.m4v' \) | sort)

          converted=0
          uploaded=0
          declare -a summary=()
          if [ "${#pick[@]}" -eq 0 ]; then
            echo "::notice::the torrent holds no video files this run would take"
          fi
          while IFS= read -r out; do
            [ -n "$out" ] || continue
            f=${pick[$out]}
            if [ "$SKIP_EXISTING" = true ] && gh release view "$TAG" --repo "$REPO" --json assets \
                --jq '.assets[].name' | grep -Fxq "$out"; then
              echo "skip $out: already in the release"
              summary+=("skipped \`$out\` (already uploaded)")
              rm -f "$f"
              continue
            fi
            echo "::group::$out from $(basename "$f")"
            opts=(--keep "$KEEP")
            [ -n "$DROP" ] && opts+=(--drop "$DROP")
            converted=$((converted + 1))
            if bash .github/scripts/aac-mp4.sh "$f" "build/$out" "${opts[@]}"; then
              size=$(stat -c%s "build/$out")
              if [ "$size" -ge $((2 * 1024 * 1024 * 1024)) ]; then
                echo "::error::$out is $((size / 1024 / 1024)) MiB, over GitHub's 2 GiB release asset limit"
                summary+=("**failed** \`$out\`: over the 2 GiB asset limit")
              else
                gh release upload "$TAG" "build/$out" --repo "$REPO" --clobber
                uploaded=$((uploaded + 1))
                summary+=("uploaded \`$out\` ($((size / 1024 / 1024)) MiB)")
                rm -f "build/$out"
              fi
            else
              echo "::error::conversion failed for $f"
              summary+=("**failed** \`$out\`: conversion error")
            fi
            echo "::endgroup::"
            # The source is done with the moment its MP4 is up, and a season pack
            # only fits on the runner if each one goes as it is replaced.
            rm -f "$f"
          done < <(printf '%s\n' "${!pick[@]}" | sort)

          {
            echo "### \`$TAG\` from torrent"
            echo ""
            echo "$converted video(s) handled, $uploaded uploaded, keep \`$KEEP\`."
            echo ""
            printf -- '- %s\n' "${summary[@]}"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$uploaded" -eq 0 ] && [ "$converted" -gt 0 ]; then
            echo "::warning::nothing was uploaded: every episode was skipped or failed"
          fi
