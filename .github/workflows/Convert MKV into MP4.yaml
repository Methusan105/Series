name: Convert MKV assets to MP4

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of the release to process (e.g. v1.2.3)"
        required: true
        type: string
      filter:
        description: "Only files matching this glob (e.g. Prison.Break.S01E01*). Empty means everything in the release."
        required: false
        default: ""
      audio_bitrate:
        description: "AAC bitrate for each audio track"
        required: false
        default: "160k"

jobs:
  mkv-to-mp4:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Aggressive disk cleanup
        run: |
          echo "=== Disk space BEFORE cleanup ==="
          df -h /
          
          # Disable and remove swap (~4GB)
          sudo swapoff /mnt/swapfile || true
          sudo rm -f /mnt/swapfile || true
          
          # Clean APT
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          
          # Docker cleanup
          sudo docker system prune -a -f --volumes || true
          sudo rm -rf /var/lib/docker || true
          
          # Remove SDKs (~10-15GB)
          sudo rm -rf /usr/share/dotnet* /usr/share/swift*
          sudo rm -rf /usr/local/lib/android* /usr/lib/jvm/*
          sudo rm -rf /opt/ghc* /usr/local/haskell* "$AGENT_TOOLSDIRECTORY"
          
          # Caches
          rm -rf ~/.npm ~/.yarn ~/.cache/pip ~/.cache/*
          
          echo "=== Disk space AFTER cleanup ==="
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg + GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg gh

      - name: Download all assets from chosen release
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ github.repository }}
          tag: ${{ inputs.release_tag }}
          fileName: ${{ inputs.filter != '' && inputs.filter || '*' }}
          latest: false

      - name: Convert MKV to MP4 with AAC audio
        shell: bash
        env:
          FILTER: ${{ inputs.filter }}
          ABR: ${{ inputs.audio_bitrate }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          converted=0
          for f in *.mkv; do
            if [ -n "$FILTER" ] && [[ "$f" != $FILTER ]]; then
              continue
            fi
            out="${f%.mkv}.mp4"
            # Video is copied untouched; the audio goes to AAC, which is what
            # Safari and iOS accept inside MP4. PCM and AC3 sources do not play
            # there even though the container is right.
            ffmpeg -y -i "$f" -map 0:v -map 0:a -c:v copy -c:a aac -b:a "$ABR" \
              -movflags +faststart "$out"
            size=$(stat -c%s "$out")
            echo "$out: $((size / 1024 / 1024)) MiB"
            if [ "$size" -ge $((2 * 1024 * 1024 * 1024)) ]; then
              echo "::error::$out is over GitHub's 2 GiB release asset limit"
              exit 1
            fi
            converted=$((converted + 1))
          done
          echo "converted=$converted" >> "$GITHUB_ENV"

      - name: Upload MP4 files to this release
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          shopt -s nullglob
          for f in *.mp4; do
            echo "Uploading $f"
            gh release upload "${{ inputs.release_tag }}" "$f" --clobber
          done
