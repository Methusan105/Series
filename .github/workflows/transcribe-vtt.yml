name: Sync subtitles to video

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release holding the videos (e.g. v1.2.0)"
        required: true
        type: string
      asset_name:
        description: "Single video asset (leave empty to sync every video in the release)"
        required: false
        default: ""
        type: string
      filter:
        description: "Only assets matching this regex (e.g. Smallville[.]S01)"
        required: false
        default: ""
        type: string
      model:
        description: "Whisper model (distil-large-v3 is the accuracy/speed sweet spot)"
        required: true
        default: distil-large-v3
        type: choice
        options:
          - tiny.en
          - base.en
          - small.en
          - medium.en
          - distil-large-v3
          - large-v3
      mode:
        description: "align = fix existing timing, replace = rewrite text from audio, missing = only build subs that do not exist"
        required: true
        default: align
        type: choice
        options:
          - align
          - replace
          - missing
      branch:
        description: "Branch the subtitles are committed to"
        required: true
        default: main
        type: string
      max_parallel:
        description: "How many videos to process at once"
        required: true
        default: "4"
        type: string
      runner:
        description: "Runner label (ubuntu-latest, or a self-hosted label with more cores or a GPU)"
        required: true
        default: ubuntu-latest
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Collect videos
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.assets.outputs.matrix }}
      count: ${{ steps.assets.outputs.count }}
    steps:
      - name: Read the release asset list
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          ASSET: ${{ inputs.asset_name }}
          FILTER: ${{ inputs.filter }}
        run: |
          set -euo pipefail
          mapfile -t names < <(
            gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' \
              | grep -Ei '\.(mp4|mkv|mov|avi|webm)$' \
              | sort
          )
          selected=()
          for name in "${names[@]}"; do
            if [ -n "$ASSET" ] && [ "$name" != "$ASSET" ]; then
              continue
            fi
            if [ -n "$FILTER" ] && ! printf '%s' "$name" | grep -Eqi "$FILTER"; then
              continue
            fi
            selected+=("$name")
          done
          count=${#selected[@]}
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "::error::no matching video assets in release '$TAG'"
            exit 1
          fi
          printf '%s\n' "${selected[@]}"
          {
            echo "matrix<<SUBSYNC_MATRIX"
            printf '%s\n' "${selected[@]}" \
              | jq -R -s -c 'split("\n") | map(select(length > 0)) | {asset: .}'
            echo "SUBSYNC_MATRIX"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Subtitle sync: \`$TAG\`"
            echo ""
            echo "$count video(s), model \`${{ inputs.model }}\`, mode \`${{ inputs.mode }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  sync:
    name: ${{ matrix.asset }}
    needs: plan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    concurrency:
      group: subsync-${{ inputs.release_tag }}-${{ matrix.asset }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install faster-whisper
        run: |
          python -m pip install --upgrade pip
          python -m pip install "faster-whisper>=1.0,<2"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.model }}

      - name: Download the video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p dl
          for attempt in 1 2 3 4; do
            if gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir dl --clobber; then
              break
            fi
            echo "download attempt $attempt failed, retrying"
            sleep $((attempt * 15))
          done
          ls -lh dl
          test -n "$(ls -A dl)"

      - name: Extract audio
        run: |
          video=$(find dl -type f -print -quit)
          ffmpeg -nostdin -loglevel error -y -i "$video" -vn -ac 1 -ar 16000 -c:a pcm_s16le audio.wav
          ls -lh audio.wav

      - name: Sync subtitles
        env:
          ASSET: ${{ matrix.asset }}
          MODEL: ${{ inputs.model }}
          MODE: ${{ inputs.mode }}
        run: |
          python .github/scripts/subsync.py \
            --asset "$ASSET" \
            --audio audio.wav \
            --model "$MODEL" \
            --mode "$MODE" \
            --stage out \
            --report report.json \
            --repo-root .

      - name: Report
        if: always()
        run: |
          if [ -f report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("report.json"))
          state = "updated" if r.get("changed") else "left alone"
          line = f"- **{r['asset']}** {state} → `{r['target']}`"
          if r.get("method"):
              line += f" ({r['method']}, offset {r.get('out_offset', r.get('offset', 0)):+.2f}s"
              if r.get("out_drift_pct") or r.get("drift"):
                  line += f", drift {r.get('out_drift_pct', r.get('drift')):+.2f}%"
              line += ")"
          print(line)
          if r.get("note"):
              print(f"  - {r['note']}")
          PY
          fi

      - name: Upload synced subtitle
        uses: actions/upload-artifact@v4
        with:
          name: subs-${{ strategy.job-index }}
          path: out/
          retention-days: 3
          if-no-files-found: ignore

  commit:
    name: Commit subtitles
    needs: [plan, sync]
    if: always() && needs.sync.result != 'cancelled' && needs.sync.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Collect synced subtitles
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: subs-*
          path: synced
          merge-multiple: true

      - name: Commit and push
        env:
          BRANCH: ${{ inputs.branch }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ ! -d synced ]; then
            echo "Nothing to commit: no subtitle needed changing."
            exit 0
          fi
          mapfile -t files < <(find synced -type f -name '*.vtt' -printf '%P\n' 2>/dev/null | sort)
          count=${#files[@]}
          if [ "$count" -eq 0 ]; then
            echo "Nothing to commit: every subtitle already fits its video."
            exit 0
          fi
          cp -a synced/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in "${files[@]}"; do git add -- "$file"; done
          git commit -m "fix(subs): sync subtitle timing for $count episode(s) from $TAG"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$BRANCH" || true
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed $count subtitle(s) to $BRANCH"
              break
            fi
            echo "push attempt $attempt rejected, retrying"
            sleep $((attempt * 10))
            if [ "$attempt" -eq 5 ]; then
              echo "::error::could not push after 5 attempts"
              exit 1
            fi
          done
          {
            echo ""
            echo "### Updated $count subtitle file(s)"
            printf -- '- `%s`\n' "${files[@]:0:40}"
          } >> "$GITHUB_STEP_SUMMARY"
