name: Transcribe MP4 to VTT (compare & fix subs)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag where MP4 is stored"
        required: true

      asset_name:
        description: "MP4 asset name (e.g., Smallville.S10E01.mp4)"
        required: true

      model:
        description: Whisper model
        required: true
        default: medium.en
        type: choice
        options:
          - tiny.en
          - base.en
          - small.en
          - medium.en
          - large-v3

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install faster-whisper
          python -m pip install "av<13"

      - name: Download MP4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading asset '${{ github.event.inputs.asset_name }}'..."

          gh release download "${{ github.event.inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ github.event.inputs.asset_name }}" \
            --output input.mp4

          ls -lh input.mp4

      - name: Create transcription script
        run: |
          cat > transcript_to_vtt.py <<'PY'
          import argparse
          from faster_whisper import WhisperModel


          def timestamp(seconds):
              h = int(seconds // 3600)
              m = int((seconds % 3600) // 60)
              s = seconds % 60
              ms = int((s % 1) * 1000)

              return f"{h:02}:{m:02}:{int(s):02}.{ms:03}"


          parser = argparse.ArgumentParser()
          parser.add_argument("input")
          parser.add_argument("-o", "--output", required=True)
          parser.add_argument("-m", "--model", default="medium.en")
          args = parser.parse_args()

          print(f"Loading faster-whisper model '{args.model}'...")
          model = WhisperModel(
              args.model, 
              device="cpu", 
              compute_type="int8",
              cpu_threads=2,
              num_workers=2
          )

          print("Transcribing...")
          segments, info = model.transcribe(
              args.input,
              language="en",
              beam_size=5,
              vad_filter=True
          )

          print("Writing VTT...")
          with open(args.output, "w", encoding="utf-8") as f:
              f.write("WEBVTT\n\n")

              for segment in segments:
                  start = timestamp(segment.start)
                  end = timestamp(segment.end)
                  text = segment.text.strip()

                  if text:
                      f.write(f"{start} --> {end}\n")
                      f.write(text + "\n\n")

          print("Done")
          PY

      - name: Run transcription
        run: |
          echo "Extracting audio..."
          ffmpeg -y -i input.mp4 -vn -acodec pcm_s16le -ar 16000 -ac 1 audio.wav

          python transcript_to_vtt.py \
            audio.wav \
            -o "transcribed.vtt" \
            -m "${{ github.event.inputs.model }}"

          ls -lh transcribed.vtt

      - name: Compare and fix existing VTT timing
        run: |
          asset="${{ github.event.inputs.asset_name }}"
          vtt_file="${asset%.mp4}.vtt"
          show=$(echo "$asset" | sed -E 's/^(.+)\.S[0-9]{2}E[0-9]{2}.*$/\1/')
          season=$(echo "$asset" | sed -E 's/^.+\.(S[0-9]{2})E[0-9]{2}.*$/\1/')
          target_dir="${show}/${season}/Subs"
          existing="${target_dir}/${vtt_file}"

          cat > compare_fix.py <<'PY'
          import re, sys, statistics, os

          def parse(path):
              cues = []
              with open(path, encoding='utf-8') as f:
                  for line in f:
                      m = re.match(r'(\d{2}:\d{2}:\d{2}\.\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}\.\d{3})', line)
                      if m:
                          def tosec(t):
                              h,mm,s = t.split(':')
                              return int(h)*3600 + int(mm)*60 + float(s)
                          cues.append((tosec(m.group(1)), tosec(m.group(2))))
              return cues

          def to_ts(sec):
              h = int(sec//3600); m = int((sec%3600)//60); s = sec%60
              ms = int((s%1)*1000)
              return f"{h:02}:{m:02}:{int(s):02}.{ms:03}"

          trans = parse('transcribed.vtt')
          if not os.path.exists(sys.argv[1]):
              # No existing VTT: just rename transcribed
              import shutil; shutil.copy('transcribed.vtt', sys.argv[2]); sys.exit(0)

          exist = parse(sys.argv[1])
          # Compute median offset (transcribed start - existing start) over paired cues
          n = min(len(trans), len(exist))
          offs = [trans[i][0]-exist[i][0] for i in range(n)]
          offset = statistics.median(offs) if offs else 0.0
          print(f"Computed offset: {offset:+.3f}s over {n} cues")

          # Shift existing VTT timestamps by offset
          with open(sys.argv[1], encoding='utf-8') as f:
              content = f.read()

          def shift_ts(ts):
              h,mm,s = ts.split(':')
              sec = int(h)*3600 + int(mm)*60 + float(s) + offset
              if sec < 0: sec = 0
              return to_ts(sec)

          def repl(m):
              return f"{shift_ts(m.group(1))} --> {shift_ts(m.group(2))}"

          new = re.sub(r'(\d{2}:\d{2}:\d{2}\.\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}\.\d{3})', repl, content)
          with open(sys.argv[2], 'w', encoding='utf-8') as f:
              f.write(new)
          PY

          mkdir -p "$target_dir"
          if [ -f "$existing" ]; then
            python compare_fix.py "$existing" "$existing"
          else
            cp transcribed.vtt "$existing"
          fi

      - name: Commit and push VTT to dynamically generated folder path
        run: |
          asset="${{ github.event.inputs.asset_name }}"
          vtt_file="${asset%.mp4}.vtt"

          # Parse Show and Season from filename pattern (e.g. Smallville.S10E01.mp4)
          show=$(echo "$asset" | sed -E 's/^(.+)\.S[0-9]{2}E[0-9]{2}.*$/\1/')
          season=$(echo "$asset" | sed -E 's/^.+\.(S[0-9]{2})E[0-9]{2}.*$/\1/')

          target_dir="${show}/${season}/Subs"

          echo "Target Directory: $target_dir"

          # Configure Git identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true

          # Create directory and move target VTT file
          mkdir -p "$target_dir"

          # Stage and commit the VTT file FIRST
          git add "$target_dir/$vtt_file"
          git commit -m "Fix subtitle timing for ${asset%.mp4} in $target_dir" || echo "No changes to commit"

          # Clean up ANY remaining temporary/untracked/modified files (like mp4, pycache, etc.)
          git clean -fd
          git checkout -- .

          # Fetch latest remote changes and rebase clean local commit
          git fetch origin main
          git rebase origin/main

          # Push to repository
          git push origin main
