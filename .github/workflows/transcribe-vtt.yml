name: Transcribe MP4 to VTT

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag where MP4 is stored"
        required: true

      asset_name:
        description: "MP4 asset name (e.g., Smallville.S10E01.mp4)"
        required: true

      mp4_url:
        description: "Browser download URL of MP4"
        required: false

      model:
        description: Whisper model
        required: true
        default: distil-large-v3
        type: choice
        options:
          - tiny.en
          - base.en
          - small.en
          - medium.en
          - distil-large-v3

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install faster-whisper

      - name: Download MP4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading asset '${{ github.event.inputs.asset_name }}'..."

          gh release download "${{ github.event.inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ github.event.inputs.asset_name }}" \
            --output input.mp4

          ls -lh input.mp4

      - name: Create transcription script
        run: |
          cat > transcript_to_vtt.py <<'PY'
          import argparse
          from faster_whisper import WhisperModel


          def timestamp(seconds):
              h = int(seconds // 3600)
              m = int((seconds % 3600) // 60)
              s = seconds % 60
              ms = int((s % 1) * 1000)

              return f"{h:02}:{m:02}:{int(s):02}.{ms:03}"


          parser = argparse.ArgumentParser()
          parser.add_argument("input")
          parser.add_argument("-o", "--output", required=True)
          parser.add_argument("-m", "--model", default="distil-large-v3")
          args = parser.parse_args()

          print(f"Loading faster-whisper model '{args.model}'...")
          model = WhisperModel(
              args.model, 
              device="cpu", 
              compute_type="int8",
              cpu_threads=2,
              num_workers=2
          )

          print("Transcribing...")
          segments, info = model.transcribe(
              args.input,
              language="en",
              beam_size=5,
              vad_filter=True
          )

          print("Writing VTT...")
          with open(args.output, "w", encoding="utf-8") as f:
              f.write("WEBVTT\n\n")

              for segment in segments:
                  start = timestamp(segment.start)
                  end = timestamp(segment.end)
                  text = segment.text.strip()

                  if text:
                      f.write(f"{start} --> {end}\n")
                      f.write(text + "\n\n")

          print("Done")
          PY

      - name: Run transcription
        run: |
          output="${{ github.event.inputs.asset_name }}"
          output="${output%.mp4}.vtt"

          python transcript_to_vtt.py \
            input.mp4 \
            -o "$output" \
            -m "${{ github.event.inputs.model }}"

          ls -lh "$output"

      - name: Commit and push VTT to dynamically generated folder path
        run: |
          asset="${{ github.event.inputs.asset_name }}"
          vtt_file="${asset%.mp4}.vtt"

          # Parse Show and Season from filename pattern (e.g. Smallville.S06E01.mp4)
          show=$(echo "$asset" | sed -E 's/^(.+)\.S[0-9]{2}E[0-9]{2}.*$/\1/')
          season=$(echo "$asset" | sed -E 's/^.+\.(S[0-9]{2})E[0-9]{2}.*$/\1/')

          target_dir="${show}/${season}/Subs"

          echo "Target Directory: $target_dir"

          # Configure Git identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Sync with remote first to prevent rejection on push
          git fetch origin main
          git pull origin main --rebase

          # Safely handle directory creation
          mkdir -p "$target_dir"

          # Move VTT file into parsed path
          mv "$vtt_file" "$target_dir/"

          # Add, commit, and push
          git add "$target_dir/$vtt_file"
          git commit -m "Add transcription for ${asset%.mp4} in $target_dir" || echo "No changes to commit"
          git push origin main
