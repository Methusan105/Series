<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You &gt; S02 &gt; 3</title>
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <script src="/Series/Playback.js"></script>
  <script src="https://cdn.sc.gl/videojs-hotkeys/latest/videojs.hotkeys.min.js"></script>
  <link rel="stylesheet" href="/Series/assets/css/player.css" />
</head>
<body>
  <div class="video-container">
    <video
      id="my-video"
      class="video-js vjs-fluid"
      controls
      preload="metadata"
      playsinline
      poster="MY_VIDEO_POSTER.jpg"
    >
      <source src="https://github.com/Methusan105/Series/releases/download/You2/You.S02E03.mp4" type="video/mp4" />
      <track kind="subtitles" src="https://raw.githubusercontent.com/Methusan105/Series/main/You/S02/Subs/You.S02E03.vtt" srclang="en" label="English" default>
      <p class="vjs-no-js">
        To view this video please enable JavaScript, and consider upgrading to a
        web browser that
        <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
      </p>
    </video>
    <div class="player-footer">
      <a href="/Series/You/S02/4.html" class="next-episode" onclick="clearGistProgress()">Next Episode &rarr;</a>
      <button class="clear-btn" type="button" onclick="clearGistProgress()">Clear Progress</button>
    </div>
    <p class="hint">Space: Play/Pause &bull; &larr; &rarr;: Seek 5s &bull; F: Fullscreen</p>
  </div>
  <script>
var player = videojs("my-video", {
  preload: "metadata",
  playbackRates: [0.5, 1, 1.25, 1.5, 2],
  fluid: true,
  plugins: {
    hotkeys: {
      volumeStep: 0.1,
      seekStep: 5,
      enableModifiersForNumbers: false,
      alwaysCaptureHotkeys: true,
      seekModifiers: false
    }
  }
});
window.player = player;

document.addEventListener("keydown", function (event) {
  if (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA") return;
  if (event.key === " ") { event.preventDefault(); player.paused() ? player.play() : player.pause(); }
  else if (event.key === "f" || event.key === "F") { player.isFullscreen() ? player.exitFullscreen() : player.requestFullscreen(); }
  else if (event.key === "ArrowLeft") { player.currentTime(player.currentTime() - 5); }
  else if (event.key === "ArrowRight") { player.currentTime(player.currentTime() + 5); }
});

var gistFilename = 'video_progress.json';
var username = sessionStorage.getItem('githubUsername');
var gistId = sessionStorage.getItem('githubGistId');
var accessToken = sessionStorage.getItem('githubAccessToken');
var lastSavedTime = -1;

function saveProgress(force) {
  if (!username || !gistId || !accessToken) return;
  var now = player.currentTime();
  if (!force && Math.abs(now - lastSavedTime) < 2) return;
  lastSavedTime = now;
  var progressData = {
    "progress": now,
    "url": window.location.href,
    "timeOnPage": (Date.now() - (window.__pageLoadTime || Date.now())) / 1000
  };
  var gistData = { "files": { [gistFilename]: { "content": JSON.stringify(progressData, null, 2) } } };
  fetch("https://api.github.com/gists/" + gistId, {
    method: 'PATCH',
    headers: { 'Authorization': 'token ' + accessToken, 'Content-Type': 'application/json' },
    body: JSON.stringify(gistData)
  }).then(function(r){ return r.json(); }).then(function(d){ console.log('Progress saved:', d); }).catch(function(e){ console.error('Save error:', e); });
}

function loadProgress() {
  if (!username || !gistId || !accessToken) return;
  fetch("https://api.github.com/gists/" + gistId)
    .then(function(r){ return r.json(); }).then(function(data) {
      if (data.files && data.files[gistFilename]) {
        try {
          var pd = JSON.parse(data.files[gistFilename].content);
          if (pd.progress) player.currentTime(parseFloat(pd.progress));
        } catch(e) {}
      }
    }).catch(function(e){ console.error('Load progress error:', e); });
}

function handleNetworkError() {
  console.log('Network error, reloading video...');
  player.load();
  fetch("https://api.github.com/gists/" + gistId)
    .then(function(r){ return r.json(); }).then(function(data) {
      if (data.files && data.files[gistFilename]) {
        try {
          var pd = JSON.parse(data.files[gistFilename].content);
          if (pd.progress) player.currentTime(parseFloat(pd.progress));
        } catch(e) {}
      }
      player.play();
    });
}

player.on("error", function () {
  if (player.error() && player.error().code === 2) {
    saveProgress(true);
    setTimeout(handleNetworkError, 3000);
  }
});

player.on("pause", function () { saveProgress(true); });
player.on("ended", function () { saveProgress(true); });
player.on("play", function () {});

window.__pageLoadTime = Date.now();

if (username && gistId && accessToken) {
  loadProgress();
}

window.addEventListener('beforeunload', function () {
  saveProgress(true);
  sessionStorage.removeItem('githubUsername');
  sessionStorage.removeItem('githubGistId');
  sessionStorage.removeItem('githubAccessToken');
});

  </script>
</body>
</html>
