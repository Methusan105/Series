<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumer</title>
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <style>
    :root {
      --bg-1: #0f0c29;
      --bg-2: #302b63;
      --bg-3: #24243e;
      --accent: #ff6a00;
      --accent-2: #ee0979;
      --text: #f5f7fa;
      --muted: #b8c0cc;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text);
    }
    body {
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }
    .bg-orb.o1 { width: 320px; height: 320px; background: var(--accent); top: -80px; left: -80px; }
    .bg-orb.o2 { width: 280px; height: 280px; background: var(--accent-2); bottom: -60px; right: -60px; animation-delay: 2s; }
    .bg-orb.o3 { width: 200px; height: 200px; background: #00c6ff; top: 40%; left: 60%; animation-delay: 4s; }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.1); }
    }
    .card {
      position: relative;
      z-index: 2;
      width: min(420px, 90vw);
      padding: 48px 40px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
      text-align: center;
      animation: cardIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: 0 8px 24px rgba(238, 9, 121, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 24px rgba(238, 9, 121, 0.4); }
      50% { transform: scale(1.06); box-shadow: 0 12px 32px rgba(238, 9, 121, 0.6); }
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fff, #ffd1e3);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }
    .dots::after {
      content: '';
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }
    #fileInput, #credBtn { display: none; }
    .btn {
      margin-top: 24px;
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(238, 9, 121, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(238, 9, 121, 0.5); }
    .credit {
      position: absolute;
      bottom: 16px;
      left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="bg-orb o1"></div>
  <div class="bg-orb o2"></div>
  <div class="bg-orb o3"></div>

  <div class="card">
    <div class="logo">▶</div>
    <h1>Resumer</h1>
    <p class="subtitle">Restoring your playback progress</p>
    <div class="spinner" id="spinner" style="display:none"></div>
    <p class="status" id="status">Waiting for credentials<span class="dots"></span></p>
    <button id="credBtn" class="btn">Choose credentials file</button>
    <input id="fileInput" type="file" accept=".txt" />
  </div>

  <div class="credit">powered by gist sync</div>

  <script src="/Series/Playback.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var gistFilename = 'video_progress.json';

      var username = sessionStorage.getItem('githubUsername');
      var gistId = sessionStorage.getItem('githubGistId');
      var accessToken = sessionStorage.getItem('githubAccessToken');

      var credBtn = document.getElementById('credBtn');
      var fileInput = document.getElementById('fileInput');

      var spinner = document.getElementById('spinner');
      var status = document.getElementById('status');

      function showLoading() {
        if (spinner) spinner.style.display = 'block';
        if (status) status.innerHTML = 'Loading<span class="dots"></span>';
      }
      function showIdle() {
        if (spinner) spinner.style.display = 'none';
        if (status) status.innerHTML = 'Waiting for credentials<span class="dots"></span>';
      }

      if (!username || !gistId || !accessToken) {
        var isTV = detectTV();
        if (isTV) {
          username = prompt('Enter your GitHub username:');
          gistId = prompt('Enter your Gist ID:');
          accessToken = prompt('Enter your GitHub Personal Access Token:');
          sessionStorage.setItem('githubUsername', username);
          sessionStorage.setItem('githubGistId', gistId);
          sessionStorage.setItem('githubAccessToken', accessToken);
          setupGistScript();
        }
        if (credBtn) {
          credBtn.style.display = 'inline-block';
          showIdle();
          credBtn.addEventListener('click', function () {
            fileInput.click();
          });
        }
        if (fileInput) {
          fileInput.addEventListener('change', function (event) {
            var file = event.target.files[0];
            if (file) {
              var reader = new FileReader();
              reader.onload = function (e) {
                processFileContent(e.target.result);
              };
              reader.readAsText(file);
            }
          });
        }
      } else {
        setupGistScript();
      }

      function detectTV() {
        var userAgent = navigator.userAgent.toLowerCase();
        return userAgent.includes('tv');
      }

      function processFileContent(content) {
        var lines = content.split('\n');
        lines.forEach(function (line) {
          var parts = line.split('=');
          if (parts.length === 2) {
            var key = parts[0].trim().toLowerCase();
            var value = parts[1].trim();
            if (key === 'username') {
              username = value;
            } else if (key === 'gist id') {
              gistId = value;
            } else if (key === 'token') {
              accessToken = value;
            }
          }
        });

        console.log('Username:', username);
        console.log('Gist ID:', gistId);
        console.log('Access Token:', accessToken);

        sessionStorage.setItem('githubUsername', username);
        sessionStorage.setItem('githubGistId', gistId);
        sessionStorage.setItem('githubAccessToken', accessToken);

        setupGistScript();
      }

      function setupGistScript() {
        showLoading();
        var gistScript = document.createElement('script');
        gistScript.src = `https://gist.github.com/${username}/${gistId}.js?access_token=${accessToken}`;
        document.head.appendChild(gistScript);

        fetch(`https://api.github.com/gists/${gistId}`)
          .then(response => response.json())
          .then(data => {
            if (data.files && data.files[gistFilename]) {
              var progressData = JSON.parse(data.files[gistFilename].content);
              if (progressData.url) {
                window.location.href = progressData.url;
              }
            }
          });
      }
    });
  </script>
</body>
</html>
