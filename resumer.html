<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Restoring your playback progress." />
  <link rel="icon" href="/Series/assets/favicon.svg" type="image/svg+xml" />
  <meta property="og:site_name" content="Series" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Resuming playback — Series" />
  <meta property="og:description" content="Restoring your playback progress." />
  <meta property="og:image" content="https://methusan105.github.io/Series/images/bg.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Resuming playback — Series</title>
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
  <script defer src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --accent: #e50914;
      --accent-hover: #f40612;
      --text: #e5e5e5;
      --muted: #a5a5a5;
      --border: #333;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:#0a0a0a;
      pointer-events: none;
      z-index: 0;
    }
    body {
      z-index: 1;
    }
    .card {
      position: relative;
      z-index: 2;
      width: min(420px, 90vw);
      padding: 48px 40px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      text-align: center;
      animation: cardIn 0.4s ease;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), rgba(229, 9, 20, 0.55));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 0 30px rgba(229, 9, 20, 0.4);
    }
    .logo svg {
      width: 34px;
      height: 34px;
      display: block;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .subtitle {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 32px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.4px;
      margin-bottom: 26px;
      min-height: 20px;
    }
    .dots::after {
      content: "";
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }
    .credit {
      position: absolute;
      bottom: 18px;
      left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="6,4 20,12 6,20" fill="currentColor" stroke="none"/>
        <path d="M4 4v16" stroke="currentColor" stroke-width="2.5"/>
      </svg>
    </div>
    <h1>Resumer</h1>
    <p class="subtitle">Restoring your playback progress</p>
    <div class="spinner" id="spinner"></div>
    <p class="status" id="status">Loading your progress<span class="dots"></span></p>
  </div>

  <div class="credit">progress saved in this browser &middot; gist sync when signed in</div>

  <script defer src="/Series/Playback.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var spinner = document.getElementById('spinner');
      var status = document.getElementById('status');

      function showLoading(text) {
        if (spinner) spinner.style.display = 'block';
        if (status) status.innerHTML = text + '<span class="dots"></span>';
      }

      SeriesAuth.require(function () {
        showLoading('Loading your progress');
        SeriesAuth.fetchProgress(SeriesAuth.get(), function (progressData) {
          if (progressData && progressData.url) {
            window.location.href = progressData.url;
          } else {
            if (spinner) spinner.style.display = 'none';
            if (status) status.textContent = 'No saved progress found — pick a series from the home page.';
          }
        });
      });
    });
  </script>
</body>
</html>
