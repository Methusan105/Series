<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumer</title>
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --accent: #e50914;
      --accent-hover: #f40612;
      --text: #e5e5e5;
      --muted: #a5a5a5;
      --border: #333;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(229, 9, 20, 0.15), transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    body {
      z-index: 1;
    }
    .card {
      position: relative;
      z-index: 2;
      width: min(420px, 90vw);
      padding: 48px 40px;
      border-radius: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      text-align: center;
      animation: cardIn 0.5s ease;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), rgba(229, 9, 20, 0.55));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 0 30px rgba(229, 9, 20, 0.4);
    }
    .logo svg {
      width: 34px;
      height: 34px;
      display: block;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .subtitle {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 32px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.4px;
      margin-bottom: 26px;
      min-height: 20px;
    }
    .dots::after {
      content: "";
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }
    #fileInput { display: none; }
    .btn {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border: none;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .btn:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 18px rgba(229, 9, 20, 0.7), 0 0 36px rgba(229, 9, 20, 0.35);
      transform: translateY(-1px);
    }
    .credit {
      position: absolute;
      bottom: 18px;
      left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="6,4 20,12 6,20" fill="currentColor" stroke="none"/>
        <path d="M4 4v16" stroke="currentColor" stroke-width="2.5"/>
      </svg>
    </div>
    <h1>Resumer</h1>
    <p class="subtitle">Restoring your playback progress</p>
    <div class="spinner" id="spinner"></div>
    <p class="status" id="status">Waiting for credentials<span class="dots"></span></p>
    <button id="credBtn" class="btn" style="display:none">Choose credentials file</button>
    <input id="fileInput" type="file" accept=".txt" />
  </div>

  <div class="credit">powered by gist sync</div>

  <script src="/Series/Playback.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var gistFilename = 'video_progress.json';

      var username = sessionStorage.getItem('githubUsername');
      var gistId = sessionStorage.getItem('githubGistId');
      var accessToken = sessionStorage.getItem('githubAccessToken');

      var credBtn = document.getElementById('credBtn');
      var fileInput = document.getElementById('fileInput');

      var spinner = document.getElementById('spinner');
      var status = document.getElementById('status');

      function showLoading() {
        if (spinner) spinner.style.display = 'block';
        if (status) status.innerHTML = 'Loading<span class="dots"></span>';
      }
      function showIdle() {
        if (spinner) spinner.style.display = 'none';
        if (status) status.innerHTML = 'Waiting for credentials<span class="dots"></span>';
      }

      if (!username || !gistId || !accessToken) {
        var isTV = detectTV();
        if (isTV) {
          username = prompt('Enter your GitHub username:');
          gistId = prompt('Enter your Gist ID:');
          accessToken = prompt('Enter your GitHub Personal Access Token:');
          sessionStorage.setItem('githubUsername', username);
          sessionStorage.setItem('githubGistId', gistId);
          sessionStorage.setItem('githubAccessToken', accessToken);
          setupGistScript();
        }
        if (credBtn) {
          credBtn.style.display = 'block';
          showIdle();
          credBtn.addEventListener('click', function () {
            fileInput.click();
          });
        }
        if (fileInput) {
          fileInput.addEventListener('change', function (event) {
            var file = event.target.files[0];
            if (file) {
              var reader = new FileReader();
              reader.onload = function (e) {
                processFileContent(e.target.result);
              };
              reader.readAsText(file);
            }
          });
        }
      } else {
        setupGistScript();
      }

      function detectTV() {
        var userAgent = navigator.userAgent.toLowerCase();
        return userAgent.includes('tv');
      }

      function processFileContent(content) {
        var lines = content.split('\n');
        lines.forEach(function (line) {
          var parts = line.split('=');
          if (parts.length === 2) {
            var key = parts[0].trim().toLowerCase();
            var value = parts[1].trim();
            if (key === 'username') {
              username = value;
            } else if (key === 'gist id') {
              gistId = value;
            } else if (key === 'token') {
              accessToken = value;
            }
          }
        });

        console.log('Username:', username);
        console.log('Gist ID:', gistId);
        console.log('Access Token:', accessToken);

        sessionStorage.setItem('githubUsername', username);
        sessionStorage.setItem('githubGistId', gistId);
        sessionStorage.setItem('githubAccessToken', accessToken);

        setupGistScript();
      }

      function setupGistScript() {
        showLoading();
        var gistScript = document.createElement('script');
        gistScript.src = `https://gist.github.com/${username}/${gistId}.js?access_token=${accessToken}`;
        document.head.appendChild(gistScript);

        fetch(`https://api.github.com/gists/${gistId}`)
          .then(response => response.json())
          .then(data => {
            if (data.files && data.files[gistFilename]) {
              var progressData = JSON.parse(data.files[gistFilename].content);
              if (progressData.url) {
                window.location.href = progressData.url;
              }
            }
          });
      }
    });
  </script>
</body>
</html>
