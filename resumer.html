<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumer</title>
  <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <style>
    :root {
      --bg: #05070d;
      --panel: rgba(255, 255, 255, 0.025);
      --accent: #e50914;
      --accent-hover: #f40612;
      --text: #ffffff;
      --muted: #c9c9c9;
      --border: rgba(255, 255, 255, 0.1);
      --highlight: rgba(255, 255, 255, 0.8);
      --radius: 34px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(1600px 900px at 20% 0%, rgba(34, 52, 90, 0.8), transparent 55%),
        radial-gradient(1300px 700px at 80% 110%, rgba(52, 14, 24, 0.8), transparent 55%);
      background-size: 240% 240%;
      animation: mesh 20s ease infinite alternate;
      pointer-events: none;
    }
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.22'/%3E%3C/svg%3E");
      opacity: 0.6;
      pointer-events: none;
    }
    @keyframes mesh {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }
    .glass-blob{
      position:fixed;z-index:-1;border-radius:50%;filter:blur(72px);opacity:0.5;pointer-events:none;
    }
    .glass-blob--1{top:8%;left:8%;width:800px;height:800px;background:radial-gradient(circle,rgba(229,9,20,0.35),transparent 60%);animation:blobFloat 16s ease-in-out infinite alternate;}
    .glass-blob--2{bottom:12%;right:8%;width:700px;height:700px;background:radial-gradient(circle,rgba(40,80,140,0.35),transparent 60%);animation:blobFloat 20s ease-in-out infinite alternate 2s;}
    .glass-blob--3{top:35%;left:52%;width:600px;height:600px;background:radial-gradient(circle,rgba(120,0,0,0.3),transparent 60%);animation:blobFloat 18s ease-in-out infinite alternate 4s;}
    @keyframes blobFloat{
      0%{transform:translate(0,0) scale(1);}
      100%{transform:translate(45px,-35px) scale(1.18);}
    }
    body {
      z-index: 1;
    }
    .card {
      position: relative;
      z-index: 2;
      width: min(460px, 94vw);
      padding: 60px 46px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 40px 110px rgba(0, 0, 0, 0.7), inset 0 1px 0 var(--highlight);
      text-align: center;
      animation: cardIn 0.7s cubic-bezier(.23,1,.32,1);
      backdrop-filter: blur(72px) saturate(2);
      -webkit-backdrop-filter: blur(72px) saturate(2);
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(229,9,20,0.4), rgba(255,255,255,0.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.8;
    }
    .card::after {
      content: "";
      position: absolute;
      top: -50px; left: -50px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(229, 9, 20, 0.4), transparent 60%);
      border-radius: 50%;
      filter: blur(32px);
      pointer-events: none;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 30px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), rgba(229, 9, 20, 0.6));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 0 44px rgba(229, 9, 20, 0.65), inset 0 1px 0 var(--highlight);
      position: relative;
      z-index: 1;
    }
    .logo svg {
      width: 34px;
      height: 34px;
      display: block;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #fff;
    }
    .subtitle {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 32px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.4px;
      margin-bottom: 26px;
      min-height: 20px;
    }
    .dots::after {
      content: "";
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }
    .credit {
      position: absolute;
      bottom: 18px;
      left: 0; right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="glass-blob glass-blob--1"></div>
  <div class="glass-blob glass-blob--2"></div>
  <div class="glass-blob glass-blob--3"></div>
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="6,4 20,12 6,20" fill="currentColor" stroke="none"/>
        <path d="M4 4v16" stroke="currentColor" stroke-width="2.5"/>
      </svg>
    </div>
    <h1>Resumer</h1>
    <p class="subtitle">Restoring your playback progress</p>
    <div class="spinner" id="spinner"></div>
    <p class="status" id="status">Waiting for sign-in<span class="dots"></span></p>
  </div>

  <div class="credit">powered by gist sync</div>

  <script src="/Series/Playback.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var gistFilename = 'video_progress.json';
      var spinner = document.getElementById('spinner');
      var status = document.getElementById('status');

      function showLoading(text) {
        if (spinner) spinner.style.display = 'block';
        if (status) status.innerHTML = text + '<span class="dots"></span>';
      }

      SeriesAuth.require(function () {
        showLoading('Loading your progress');
        SeriesAuth.fetchProgress(SeriesAuth.get(), function (progressData) {
          if (progressData && progressData.url) {
            window.location.href = progressData.url;
          } else {
            if (spinner) spinner.style.display = 'none';
            if (status) status.textContent = 'No saved progress found — pick a series from the home page.';
          }
        });
      });
    });
  </script>
</body>
</html>
